name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - name: Check formatting, vetting and modernization
        run: |
          task lint
          if [ -n "$(git status --porcelain)" ]; then
            git diff
            echo "::error::Unformatted or non-modernized code found, run 'task lint' and commit the changes."
            exit 1
          fi
