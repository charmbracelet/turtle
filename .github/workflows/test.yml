name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.module }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        module: [coreutils, fsx]
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v2

      - name: Test
        run: go test ./...
        working-directory: ${{ matrix.module }}
