version: '3'

vars:
  MODULES:
    - coreutils
    - shcoreutils
    - fsx
  PROGRAMS:
    sh: ls coreutils/cmd

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  test:
    desc: Run tests for all modules
    cmds:
      - for: { var: MODULES }
        task: exec
        vars:
          MODULE: '{{.ITEM}}'
          CMD: go test -count=1 -race ./...

  cover:
    desc: Run tests with coverage for all modules
    cmds:
      - for: { var: MODULES }
        task: exec
        vars:
          MODULE: '{{.ITEM}}'
          CMD: go test -count=1 -cover ./...

  fmt:
    desc: Format all Go code
    cmds:
      - gofumpt -w .

  vet:
    desc: Run go vet for all modules
    cmds:
      - for: { var: MODULES }
        task: exec
        vars:
          MODULE: '{{.ITEM}}'
          CMD: go vet ./...

  modernize:
    desc: Modernize all Go code
    cmds:
      - for: { var: MODULES }
        task: exec
        vars:
          MODULE: '{{.ITEM}}'
          CMD: modernize -fix ./...

  lint:
    desc: Format, vet and modernize all Go code
    cmds:
      - task: fmt
      - task: vet
      - task: modernize

  bin:
    desc: Build all coreutils binaries into bin/
    cmds:
      - mkdir -p bin
      - for: { var: PROGRAMS }
        task: build
        vars:
          PROG: '{{.ITEM}}'

  build:
    internal: true
    dir: coreutils
    cmds:
      - go build -o ../bin/{{.PROG}} ./cmd/{{.PROG}}

  tag:coreutils:
    desc: Tag coreutils (task tag:coreutils -- vX.Y.Z)
    cmds:
      - task: tag
        vars:
          MODULE: coreutils
          VERSION: '{{.CLI_ARGS}}'

  tag:shcoreutils:
    desc: Tag shcoreutils (task tag:shcoreutils -- vX.Y.Z)
    cmds:
      - task: tag
        vars:
          MODULE: shcoreutils
          VERSION: '{{.CLI_ARGS}}'

  tag:fsx:
    desc: Tag fsx (task tag:fsx -- vX.Y.Z)
    cmds:
      - task: tag
        vars:
          MODULE: fsx
          VERSION: '{{.CLI_ARGS}}'

  tag:
    internal: true
    preconditions:
      - sh: 'case "{{.VERSION}}" in v[0-9]*) exit 0;; *) exit 1;; esac'
        msg: 'missing or invalid version, use: task tag:{{.MODULE}} -- vX.Y.Z'
    cmds:
      - |
        if [ "{{.MODULE}}" = coreutils ]; then
          printf '%s\n' '{{.VERSION}}' > coreutils/version.txt
          git add coreutils/version.txt
        fi
      - git commit --allow-empty -m '{{.MODULE}}/{{.VERSION}}'
      - git tag -a '{{.MODULE}}/{{.VERSION}}' -m '{{.MODULE}}/{{.VERSION}}'

  exec:
    internal: true
    dir: '{{.MODULE}}'
    cmds:
      - '{{.CMD}}'
