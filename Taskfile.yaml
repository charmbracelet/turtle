version: '3'

vars:
  MODULES:
    - coreutils
    - fsx
  PROGRAMS:
    sh: ls coreutils/cmd

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  test:
    desc: Run tests for all modules
    cmds:
      - for: { var: MODULES }
        task: exec
        vars:
          MODULE: '{{.ITEM}}'
          CMD: go test ./...

  fmt:
    desc: Format all Go code
    cmds:
      - gofumpt -w .

  modernize:
    desc: Modernize all Go code
    cmds:
      - for: { var: MODULES }
        task: exec
        vars:
          MODULE: '{{.ITEM}}'
          CMD: modernize -fix ./...

  bin:
    desc: Build all coreutils binaries into bin/
    cmds:
      - mkdir -p bin
      - for: { var: PROGRAMS }
        task: build
        vars:
          PROG: '{{.ITEM}}'

  build:
    internal: true
    dir: coreutils
    cmds:
      - go build -o ../bin/{{.PROG}} ./cmd/{{.PROG}}

  exec:
    internal: true
    dir: '{{.MODULE}}'
    cmds:
      - '{{.CMD}}'
